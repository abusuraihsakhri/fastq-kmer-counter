name: FASTQ k-mer counter CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test and optional API dependencies
        run: python -m pip install pytest fastapi uvicorn "pydantic>=2,<3" httpx
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Test Python core and API
        run: python -m pytest -q
      - name: Test browser k-mer implementation
        run: node --test web/app.test.cjs
      - name: Validate container image
        if: matrix.python-version == '3.12'
        run: docker build -t fastq-kmer-counter:ci .
